openapi: 3.1.0
info:
  title: Agricultural federation API
  description: |
    # Versioning
    This API uses semantic versioning (MAJOR.MINOR.PATCH).
    - v0.0.1 : POST /collectivities, POST /members.
    - v0.0.2 : PUT /collectivities/{id}/informations.
    - v0.0.3 : Membership fees, transactions and payments.
    - v0.0.4 (2026-04-23) : GET /collectivities/{id} and GET /collectivities/{id}/financialAccounts with history.
  version: 0.0.4
servers:
  - url: 'https://localhost:8080'
paths:
  '/collectivities':
    post:
      summary: Create list of collectivities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateCollectivity'
      responses:
        '201':
          description: List of created collectivities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collectivity'

  '/collectivities/{id}':
    get:
      summary: Get a specific collectivity with its members
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed collectivity information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'
        '404':
          description: Collectivity not found.

  '/collectivities/{id}/informations':
    put:
      summary: Attribute collectivity informations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectivityInformation'
      responses:
        '200':
          description: Updated collectivity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'
        '400':
          description: Name or number already used.

  '/collectivities/{id}/financialAccounts':
    get:
      summary: Retrieve collectivity financial accounts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: at
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of financial accounts with balances.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialAccount'
        '404':
          description: Collectivity not found.

  '/collectivities/{id}/membershipFees':
    get:
      summary: Retrieve collectivity membership fees
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of membership fees.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipFee'
    post:
      summary: Create new membership fees
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMembershipFee'
      responses:
        '200':
          description: Created membership fees.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipFee'

  '/collectivities/{id}/transactions':
    get:
      summary: Retrieve transactions for a period
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of transactions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectivityTransaction'

  '/members':
    post:
      summary: Admission of a list of members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMember'
      responses:
        '201':
          description: List of created members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'

  '/members/{id}/payments':
    post:
      summary: Register a list of payments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMemberPayment'
      responses:
        '201':
          description: List of created payments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberPayment'

components:
  schemas:
    CreateCollectivity:
      type: object
      properties:
        location:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberIdentifier'
        federationApproval:
          type: boolean
        structure:
          $ref: '#/components/schemas/CreateCollectivityStructure'

    CollectivityInformation:
      type: object
      properties:
        name:
          type: string
        number:
          type: integer

    Collectivity:
      allOf:
        - $ref: '#/components/schemas/CollectivityInformation'
      type: object
      properties:
        id:
          type: string
        location:
          type: string
        structure:
          $ref: '#/components/schemas/CollectivityStructure'
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    FinancialAccount:
      oneOf:
        - $ref: '#/components/schemas/CashAccount'
        - $ref: '#/components/schemas/MobileBankingAccount'
        - $ref: '#/components/schemas/BankAccount'

    CashAccount:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number

    MobileBankingAccount:
      type: object
      properties:
        id:
          type: string
        holderName:
          type: string
        mobileBankingService:
          $ref: '#/components/schemas/MobileBankingService'
        mobileNumber:
          type: string
        amount:
          type: number

    BankAccount:
      type: object
      properties:
        id:
          type: string
        holderName:
          type: string
        bankName:
          $ref: '#/components/schemas/Bank'
        bankCode:
          type: integer
        bankBranchCode:
          type: integer
        bankAccountNumber:
          type: string
        bankAccountKey:
          type: integer
        amount:
          type: number

    MemberIdentifier:
      type: string

    Member:
      allOf:
        - $ref: '#/components/schemas/MemberInformation'
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MemberIdentifier'
        referees:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    MemberInformation:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        address:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
        occupation:
          $ref: '#/components/schemas/MemberOccupation'

    CreateMember:
      allOf:
        - $ref: '#/components/schemas/MemberInformation'
      type: object
      properties:
        collectivityIdentifier:
          type: string
        registrationFeePaid:
          type: boolean
        membershipDuesPaid:
          type: boolean

    MembershipFee:
      allOf:
        - $ref: '#/components/schemas/CreateMembershipFee'
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/ActivityStatus'

    CreateMembershipFee:
      type: object
      properties:
        eligibleFrom:
          type: string
          format: date
        frequency:
          $ref: '#/components/schemas/Frequency'
        amount:
          type: number
        label:
          type: string

    CreateMemberPayment:
      type: object
      properties:
        amount:
          type: number
        membershipFeeIdentifier:
          type: string
        accountCreditedIdentifier:
          type: string
        paymentMode:
          $ref: '#/components/schemas/PaymentMode'

    MemberPayment:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        creationDate:
          type: string
          format: date
        paymentMode:
          $ref: '#/components/schemas/PaymentMode'

    CollectivityTransaction:
      type: object
      properties:
        id:
          type: string
        creationDate:
          type: string
          format: date
        amount:
          type: number
        paymentMode:
          $ref: '#/components/schemas/PaymentMode'
        memberDebited:
          $ref: '#/components/schemas/Member'

    CreateCollectivityStructure:
      type: object
      properties:
        president: { $ref: '#/components/schemas/MemberIdentifier' }
        vicePresident: { $ref: '#/components/schemas/MemberIdentifier' }
        treasurer: { $ref: '#/components/schemas/MemberIdentifier' }
        secretary: { $ref: '#/components/schemas/MemberIdentifier' }

    CollectivityStructure:
      type: object
      properties:
        president: { $ref: '#/components/schemas/Member' }
        vicePresident: { $ref: '#/components/schemas/Member' }
        treasurer: { $ref: '#/components/schemas/Member' }
        secretary: { $ref: '#/components/schemas/Member' }

    Gender:
      type: string
      enum: [MALE, FEMALE]
    MemberOccupation:
      type: string
      enum: [JUNIOR, SENIOR, SECRETARY, TREASURER, VICE_PRESIDENT, PRESIDENT]
    Frequency:
      type: string
      enum: [WEEKLY, MONTHLY, ANNUALLY, PUNCTUALLY]
    ActivityStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    PaymentMode:
      type: string
      enum: [CASH, MOBILE_BANKING, BANK_TRANSFER]
    MobileBankingService:
      type: string
      enum: [AIRTEL_MONEY, MVOLA, ORANGE_MONEY]
    Bank:
      type: string
      enum: [BRED, MCB, BMOI, BOA, BGFI, AFG, ACCES_BAQUE, BAOBAB, SIPEM]