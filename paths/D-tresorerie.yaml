# ==============================================================================
# D - TRÉSORERIE
# Fonctionnalité : Comptes et situation financière
# ==============================================================================

comptes:
  get:
    tags: [Trésorerie]
    summary: Lister les comptes d'une collectivité
    operationId: getComptes
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/collectiviteId'
      - name: type
        in: query
        schema:
          $ref: '../components/schemas.yaml#/components/schemas/TypeCompte'
    responses:
      '200':
        description: Liste des comptes
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CompteListResponse'

  post:
    tags: [Trésorerie]
    summary: Créer un nouveau compte pour une collectivité
    operationId: creerCompte
    description: |
      Crée un compte bancaire, mobile money ou caisse.
      Contraintes :
      - Une seule caisse par collectivité
      - Plusieurs comptes bancaires ou mobile money autorisés
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/collectiviteId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/CompteCreationRequest'
    responses:
      '201':
        description: Compte créé
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CompteResponse'
      '400':
        $ref: '../components/responses.yaml#/responses/BadRequest'
      '422':
        $ref: '../components/responses.yaml#/responses/UnprocessableEntity'

comptesId:
  get:
    tags: [Trésorerie]
    summary: Obtenir les détails d'un compte
    operationId: getCompteById
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/collectiviteId'
      - $ref: '../components/parameters.yaml#/parameters/compteId'
    responses:
      '200':
        description: Détails du compte
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CompteResponse'
      '404':
        $ref: '../components/responses.yaml#/responses/NotFound'

  patch:
    tags: [Trésorerie]
    summary: Mettre à jour le solde d'un compte
    operationId: updateSoldeCompte
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/collectiviteId'
      - $ref: '../components/parameters.yaml#/parameters/compteId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [solde, dateReleve]
            properties:
              solde:
                type: number
                format: double
                description: Nouveau solde en MGA
              dateReleve:
                type: string
                format: date
    responses:
      '200':
        description: Solde mis à jour
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CompteResponse'
      '404':
        $ref: '../components/responses.yaml#/responses/NotFound'

  delete:
    tags: [Trésorerie]
    summary: Supprimer un compte
    operationId: deleteCompte
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/collectiviteId'
      - $ref: '../components/parameters.yaml#/parameters/compteId'
    responses:
      '204':
        description: Compte supprimé
      '404':
        $ref: '../components/responses.yaml#/responses/NotFound'

