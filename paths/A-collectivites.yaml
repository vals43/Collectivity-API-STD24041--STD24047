# ==============================================================================
# A - COLLECTIVITÉS (Fichier : paths/A-collectivites.yaml)
# ==============================================================================

/collectivites:
  get:
    tags: [Collectivités]
    summary: Lister toutes les collectivités
    operationId: getCollectivites
    parameters:
      - name: ville
        in: query
        schema:
          type: string
        description: Filtrer par ville
      - name: specialite
        in: query
        schema:
          type: string
        description: Filtrer par spécialité agricole
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    responses:
      '200':
        description: Liste des collectivités
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CollectiviteListResponse'

  post:
    tags: [Collectivités]
    summary: Demander l'ouverture d'une nouvelle collectivité
    operationId: creerCollectivite
    description: |
      Soumet une demande d'ouverture d'une nouvelle collectivité à la fédération.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/CollectiviteCreationRequest'
    responses:
      '201':
        description: Demande d'ouverture soumise avec succès
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CollectiviteResponse'
      '400':
        $ref: '../components/responses.yaml#/responses/BadRequest'
      '422':
        $ref: '../components/responses.yaml#/responses/UnprocessableEntity'

/collectivites/{id}:
  get:
    tags: [Collectivités]
    summary: Obtenir les détails d'une collectivité
    operationId: getCollectiviteById
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/collectiviteId'
    responses:
      '200':
        description: Détails de la collectivité
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CollectiviteResponse'
      '404':
        $ref: '../components/responses.yaml#/responses/NotFound'

  patch:
    tags: [Collectivités]
    summary: Modifier les informations d'une collectivité
    operationId: updateCollectivite
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/collectiviteId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/CollectiviteUpdateRequest'
    responses:
      '200':
        description: Collectivité mise à jour
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CollectiviteResponse'
      '400':
        $ref: '../components/responses.yaml#/responses/BadRequest'
      '404':
        $ref: '../components/responses.yaml#/responses/NotFound'

/collectivites/{id}/autorisation:
  post:
    tags: [Collectivités]
    summary: Délivrer l'autorisation d'ouverture (fédération seulement)
    operationId: autoriserCollectivite
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/collectiviteId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [autorise, commentaire]
            properties:
              autorise:
                type: boolean
                example: true
              commentaire:
                type: string
                example: "Dossier complet."
    responses:
      '200':
        description: Décision enregistrée
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CollectiviteResponse'
      '400':
        $ref: '../components/responses.yaml#/responses/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/responses/NotFound'