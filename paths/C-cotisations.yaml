# ==============================================================================
# C - COTISATIONS
# Fonctionnalité : Cotisations et paiements
# ==============================================================================

cotisations:
  get:
    tags: [Cotisations]
    summary: Lister les cotisations d'une collectivité
    operationId: getCotisations
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/collectiviteId'
      - name: membreId
        in: query
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        schema:
          $ref: '../components/schemas.yaml#/components/schemas/TypeCotisation'
      - name: dateDebut
        in: query
        schema:
          type: string
          format: date
      - name: dateFin
        in: query
        schema:
          type: string
          format: date
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    responses:
      '200':
        description: Liste des cotisations
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CotisationListResponse'

  post:
    tags: [Cotisations]
    summary: Enregistrer un encaissement (cotisation)
    operationId: enregistrerCotisation
    description: |
      Le trésorier enregistre un paiement de cotisation.
      Un pourcentage des cotisations périodiques est automatiquement reversé à la fédération.
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/collectiviteId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/CotisationCreationRequest'
    responses:
      '201':
        description: Cotisation enregistrée
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CotisationResponse'
      '400':
        $ref: '../components/responses.yaml#/responses/BadRequest'
      '404':
        $ref: '../components/responses.yaml#/responses/NotFound'

cotisationsId:
  get:
    tags: [Cotisations]
    summary: Obtenir les détails d'une cotisation
    operationId: getCotisationById
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/collectiviteId'
      - $ref: '../components/parameters.yaml#/parameters/cotisationId'
    responses:
      '200':
        description: Détails de la cotisation
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CotisationResponse'
      '404':
        $ref: '../components/responses.yaml#/responses/NotFound'

federationCotisations:
  get:
    tags: [Cotisations]
    summary: Lister les reversements reçus par la fédération
    operationId: getCotisationsFederation
    parameters:
      - name: dateDebut
        in: query
        schema:
          type: string
          format: date
      - name: dateFin
        in: query
        schema:
          type: string
          format: date
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    responses:
      '200':
        description: Liste des reversements
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/CotisationListResponse'

tauxReversement:
  get:
    tags: [Cotisations]
    summary: Obtenir le taux de reversement actuel à la fédération
    operationId: getTauxReversement
    responses:
      '200':
        description: Taux de reversement en vigueur
        content:
          application/json:
            schema:
              type: object
              properties:
                taux:
                  type: number
                  format: float
                  example: 0.10
                dateEffet:
                  type: string
                  format: date

  put:
    tags: [Cotisations]
    summary: Modifier le taux de reversement à la fédération
    operationId: setTauxReversement
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [taux, dateEffet]
            properties:
              taux:
                type: number
                format: float
                minimum: 0
                maximum: 1
              dateEffet:
                type: string
                format: date
    responses:
      '200':
        description: Taux mis à jour
      '400':
        $ref: '../components/responses.yaml#/responses/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/responses/Forbidden'