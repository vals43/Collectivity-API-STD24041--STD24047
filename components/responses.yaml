# ==============================================================================
# RESPONSES — Réponses d'erreur communes à toutes les fonctionnalités
# ==============================================================================

responses:
  BadRequest:
    description: Requête invalide — données manquantes ou format incorrect
    content:
      application/json:
        schema:
          $ref: './schemas.yaml#/components/schemas/ErrorResponse'

  NotFound:
    description: Ressource introuvable
    content:
      application/json:
        schema:
          $ref: './schemas.yaml#/components/schemas/ErrorResponse'

  Forbidden:
    description: Action non autorisée pour ce rôle
    content:
      application/json:
        schema:
          $ref: './schemas.yaml#/components/schemas/ErrorResponse'

  UnprocessableEntity:
    description: Violation d'une règle métier
    content:
      application/json:
        schema:
          $ref: './schemas.yaml#/components/schemas/ErrorResponse'
